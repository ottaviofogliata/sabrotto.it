<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Super Sabrotto Top 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #171220;
    --panel: rgba(15, 10, 28, 0.88);
    --line: rgba(255, 255, 255, 0.18);
    --fg: #fff7ef;
    --muted: #d7cce1;
    --gold: #ffd65d;
    --blue: #79d8ff;
    --red: #ff8f67;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 22% 12%, rgba(121, 216, 255, 0.22), transparent 24%),
      radial-gradient(circle at 82% 18%, rgba(255, 214, 93, 0.18), transparent 26%),
      linear-gradient(180deg, #1e356d 0%, #425da8 48%, #ffb169 100%);
    color: var(--fg);
    font-family: 'VT323', 'Courier New', monospace;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.18) 0,
        rgba(0, 0, 0, 0.18) 2px,
        transparent 2px,
        transparent 4px
      ),
      radial-gradient(circle at center, transparent 58%, rgba(8, 6, 12, 0.24) 100%);
  }

  .screen {
    position: relative;
    z-index: 1;
    width: min(1120px, calc(100% - 28px));
    min-height: 100vh;
    margin: 0 auto;
    display: grid;
    align-content: center;
    gap: clamp(16px, 3vmin, 30px);
    padding: clamp(20px, 4vmin, 46px) 0;
    box-sizing: border-box;
  }

  .title,
  .subtitle,
  .back,
  .table-head,
  .score-row,
  .status {
    font-family: 'Press Start 2P', monospace;
    text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
  }

  .title {
    margin: 0;
    color: var(--gold);
    font-size: clamp(24px, 5vmin, 58px);
    line-height: 1.18;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .subtitle {
    margin: 0;
    color: var(--blue);
    font-size: clamp(9px, 1.4vmin, 15px);
    letter-spacing: 0.24em;
    line-height: 1.8;
    text-align: center;
  }

  .board {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
      var(--panel);
    border: 4px solid var(--ink);
    box-shadow:
      8px 8px 0 rgba(0, 0, 0, 0.52),
      inset 0 0 0 3px var(--line);
    overflow: hidden;
  }

  .table-head,
  .score-row {
    display: grid;
    grid-template-columns: 70px minmax(0, 1fr) 120px 110px 90px 90px;
    gap: 10px;
    align-items: center;
    padding: 14px 18px;
    box-sizing: border-box;
  }

  .table-head {
    color: var(--gold);
    background: rgba(0, 0, 0, 0.34);
    border-bottom: 3px solid var(--ink);
    font-size: clamp(8px, 1vmin, 11px);
    letter-spacing: 0.12em;
  }

  .score-row {
    min-height: 58px;
    color: var(--fg);
    font-size: clamp(9px, 1.1vmin, 13px);
    border-bottom: 2px solid rgba(255, 255, 255, 0.08);
  }

  .score-row:nth-child(even) {
    background: rgba(255, 255, 255, 0.04);
  }

  .score-row:last-child {
    border-bottom: 0;
  }

  .rank {
    color: var(--gold);
  }

  .name {
    color: var(--blue);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .score {
    color: var(--gold);
    text-align: right;
  }

  .muted {
    color: var(--muted);
    text-align: right;
  }

  .status {
    margin: 0;
    padding: clamp(24px, 5vmin, 54px);
    color: var(--red);
    font-size: clamp(10px, 1.4vmin, 16px);
    line-height: 1.7;
    text-align: center;
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .back {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 190px;
    padding: 14px 24px;
    background: var(--gold);
    color: var(--ink);
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.55);
    text-decoration: none;
    letter-spacing: 0.08em;
  }

  .back:active {
    transform: translate(4px, 4px);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55);
  }

  .back small {
    color: rgba(23, 18, 32, 0.72);
    font-size: 9px;
    letter-spacing: 0.2em;
  }

  @media (max-width: 820px) {
    .table-head,
    .score-row {
      grid-template-columns: 48px minmax(0, 1fr) 96px;
    }

    .hide-sm {
      display: none;
    }
  }

  @media (max-width: 520px) {
    .screen {
      width: min(100% - 18px, 1120px);
    }

    .table-head,
    .score-row {
      padding: 12px 10px;
      gap: 8px;
    }
  }
</style>
</head>
<body>
  <main class="screen">
    <header>
      <h1 class="title">TOP 50<br>HEROES</h1>
      <p class="subtitle">SUPER SABROTTO 16BIT SCOREBOARD</p>
    </header>

    <section class="board" aria-live="polite">
      <div class="table-head">
        <span>#</span>
        <span>NAME</span>
        <span class="score">SCORE</span>
        <span class="muted hide-sm">HERO</span>
        <span class="muted hide-sm">COINS</span>
        <span class="muted hide-sm">TIME</span>
      </div>
      <div id="scores">
        <p class="status">LOADING SCORES...</p>
      </div>
    </section>

    <nav class="actions" aria-label="Minigame navigation">
      <a class="back" href="super.html"><small>BACK</small><span>PLAY</span></a>
    </nav>
  </main>

<script>
  (function () {
    const list = document.getElementById('scores');

    function padScore(value) {
      return String(Math.max(0, Math.floor(Number(value) || 0))).padStart(5, '0');
    }

    function heroLabel(value) {
      return value === 'sabrina' ? 'SABRI' : 'OTTO';
    }

    function status(message) {
      list.innerHTML = '<p class="status">' + message + '</p>';
    }

    function cell(cls, text) {
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      return span;
    }

    function render(scores) {
      if (!scores.length) {
        status('NO SCORES YET');
        return;
      }
      list.innerHTML = '';
      scores.slice(0, 50).forEach(function (row, index) {
        const el = document.createElement('div');
        el.className = 'score-row';
        el.appendChild(cell('rank', String(row.rank || index + 1).padStart(2, '0')));
        el.appendChild(cell('name', row.playerName || 'PLAYER'));
        el.appendChild(cell('score', padScore(row.score)));
        el.appendChild(cell('muted hide-sm', heroLabel(row.heroKey)));
        el.appendChild(cell('muted hide-sm', String(row.coins || 0).padStart(2, '0')));
        el.appendChild(cell('muted hide-sm', String(row.timeRemaining || 0)));
        list.appendChild(el);
      });
    }

    async function loadScores() {
      if (window.location.protocol === 'file:') {
        status('SERVE WITH NUXT TO LOAD SCORES');
        return;
      }
      try {
        const response = await fetch('/api/minigame/scores', {
          headers: { Accept: 'application/json' },
        });
        if (!response.ok) throw new Error('bad response');
        const data = await response.json();
        render(Array.isArray(data.scores) ? data.scores : []);
      } catch (err) {
        status('SCORE SERVER OFFLINE');
      }
    }

    loadScores();
  })();
</script>
</body>
</html>
