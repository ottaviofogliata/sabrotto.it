<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuperOtto Sprite Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #86d8ff;
    --bg-2: #7f74d7;
    --bg-3: #ffbe6d;
    --ink: #1a1324;
    --panel: rgba(18, 13, 30, 0.88);
    --panel-soft: rgba(28, 21, 42, 0.74);
    --line: rgba(255, 255, 255, 0.12);
    --fg: #fff8ef;
    --muted: #cfc6d9;
    --accent: #ffd65d;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.16), transparent 22%),
      radial-gradient(circle at 82% 14%, rgba(255, 214, 93, 0.16), transparent 26%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    color: var(--fg);
    font-family: 'VT323', 'Courier New', monospace;
    padding: 28px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at center, transparent 52%, rgba(8, 6, 14, 0.18) 100%),
      repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.02) 0,
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 18px
      );
  }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 1480px;
    margin: 0 auto;
  }

  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 18px;
    align-items: end;
    margin-bottom: 20px;
  }

  .hero h1,
  .controls h2,
  .sprite-group-head h2,
  .sprite-card-head h3,
  .sprite-card-tag {
    font-family: 'Press Start 2P', monospace;
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(26px, 3.8vw, 44px);
    color: var(--accent);
    line-height: 1.2;
  }

  .hero p {
    margin: 14px 0 0;
    max-width: 780px;
    font-size: clamp(24px, 2.4vw, 30px);
    color: var(--fg);
    line-height: 1.1;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 22px;
    margin-bottom: 24px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 18%), var(--panel);
    border: 2px solid var(--line);
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.18);
  }

  .controls-panel {
    min-width: 240px;
  }

  .controls h2 {
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.06em;
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #scale-range {
    width: 180px;
  }

  #scale-value {
    min-width: 40px;
    font-size: 28px;
  }

  .bg-switch {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .bg-btn {
    border: 0;
    cursor: pointer;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--fg);
    font: inherit;
    font-size: 22px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .bg-btn.active {
    background: linear-gradient(180deg, var(--accent), #ffeeb4);
    color: var(--ink);
  }

  .sprite-group {
    margin-top: 26px;
  }

  .sprite-group-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 12px;
  }

  .sprite-group-head h2 {
    margin: 0;
    font-size: clamp(16px, 1.8vw, 24px);
    color: var(--accent);
    line-height: 1.2;
  }

  .sprite-group-head p {
    margin: 0;
    max-width: 720px;
    font-size: 24px;
    text-align: right;
    color: var(--muted);
  }

  .sprite-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }

  .sprite-card {
    padding: 18px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 16%), var(--panel-soft);
    border: 2px solid var(--line);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16);
  }

  .sprite-card-head {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 14px;
  }

  .sprite-card-head h3 {
    margin: 0;
    font-size: 14px;
    color: var(--fg);
    line-height: 1.5;
  }

  .sprite-card-head p {
    margin: 10px 0 0;
    font-size: 22px;
    color: var(--muted);
  }

  .sprite-card-tag {
    flex: 0 0 auto;
    padding: 8px 10px;
    border-radius: 999px;
    font-size: 9px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--accent);
  }

  .preview-wrap {
    display: grid;
    place-items: center;
    min-height: 220px;
    margin-top: 16px;
    padding: 16px;
    border-radius: 18px;
    background: rgba(8, 6, 14, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .atomics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }

  .frame-chip {
    padding: 12px;
    border-radius: 16px;
    background: rgba(8, 6, 14, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .frame-chip-head strong,
  .frame-chip-head span {
    display: block;
  }

  .frame-chip-head strong {
    font-size: 22px;
    color: var(--fg);
  }

  .frame-chip-head span {
    margin-top: 4px;
    font-size: 18px;
    color: var(--muted);
  }

  .frame-chip-meta {
    margin-top: 8px;
    font-size: 18px;
    color: var(--muted);
  }

  .sprite-canvas {
    display: block;
    margin: 12px auto 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 10px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  .preview {
    max-width: 100%;
    height: auto;
  }

  @media (max-width: 900px) {
    body {
      padding: 16px;
    }

    .hero {
      grid-template-columns: 1fr;
    }

    .sprite-group-head {
      display: block;
    }

    .sprite-group-head p {
      margin-top: 8px;
      text-align: left;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <h1>Sprite Lab</h1>
        <p>Atomic frames and animation previews extracted from the minigame, in a separate workspace so we can improve them one by one without touching the level view first.</p>
      </div>
    </header>

    <section class="controls">
      <div class="controls-panel">
        <h2>Zoom</h2>
        <div class="range-row">
          <input id="scale-range" type="range" min="4" max="14" step="1" value="8" />
          <span id="scale-value">8x</span>
        </div>
      </div>
      <div class="controls-panel">
        <h2>Background</h2>
        <div class="bg-switch">
          <button class="bg-btn active" data-bg="sky">Sky</button>
          <button class="bg-btn" data-bg="neutral">Neutral</button>
          <button class="bg-btn" data-bg="night">Night</button>
        </div>
      </div>
    </section>

    <main id="app"></main>
  </div>

  <script src="src/sprites.js?v=35"></script>
  <script src="src/sprites-gallery.js?v=35"></script>
</body>
</html>
